name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install libusb pkg-config
      - name: Build
        run: make
      - name: Tests (simulated scanner)
        run: make check

  linux-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests (simulated scanner)
        run: make check
